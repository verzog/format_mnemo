name: WebXR gesture smoke test

# Runs the headless WebXR tests (tests/webxr): the gesture smoke test that
# drives the real GestureManager through scripted controller/hand input, the
# built-in glTF parser test, and the addon glTF-loader test that decodes
# Draco- and meshopt-compressed models through the real GLTFLoader stack.
# Separate from the Moodle CI matrix so it never blocks it.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'amd/src/vr.js'
      - 'js/three-esm-loader.js'
      - 'thirdparty/jsm/**'
      - 'tests/webxr/**'
      - '.github/workflows/webxr-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tests/webxr
        run: npm ci

      - name: Install Chromium
        working-directory: tests/webxr
        run: npx playwright install --with-deps chromium

      - name: Run WebXR gesture + glTF loader tests
        working-directory: tests/webxr
        run: npm test
