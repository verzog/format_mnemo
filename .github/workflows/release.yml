name: Release zip

# Publishing a GitHub release builds the installable plugin zip and attaches it
# to that release. The zip's root folder is the plugin directory name (mnemo/),
# which is what Moodle's "Install plugins" page expects. Never attach a zip by
# hand: re-run this workflow instead.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      COMPONENT: format_mnemo
      PLUGINNAME: mnemo

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the tag matches version.php
        # Tags carry a leading "v"; $plugin->release does not (v1.3.0 <-> 1.3.0).
        run: |
          RELEASE="$(sed -n "s/^\$plugin->release *= *'\([^']*\)';.*/\1/p" version.php)"
          echo "Tag: $TAG - version.php release: $RELEASE"
          if [ -z "$RELEASE" ]; then
            echo "::error::Could not read \$plugin->release from version.php."
            exit 1
          fi
          if [ "${TAG#v}" != "$RELEASE" ]; then
            echo "::error::Tag $TAG does not match \$plugin->release '$RELEASE' (expected tag v$RELEASE)."
            exit 1
          fi

      - name: Build the zip
        # Paths marked export-ignore in .gitattributes (CI config, tests) are
        # left out of the archive.
        run: git archive --format=zip --prefix="$PLUGINNAME/" -o "$COMPONENT-$TAG.zip" "$TAG"

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$COMPONENT-$TAG.zip" --clobber
